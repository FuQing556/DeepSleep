<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Harness 六帧挥剑测试</title>
<style>body{background:#161923;color:#eee;font:16px system-ui;margin:24px}main{max-width:1100px;margin:auto}.views{display:flex;gap:24px;flex-wrap:wrap}.stage{width:480px;height:480px;position:relative;overflow:hidden;background:#ccc}.sprite{position:absolute;width:100%;height:100%;background-image:url('HA_Swing6_Test_v01.png');background-size:300% 200%;background-repeat:no-repeat}.cross{position:absolute;left:50%;top:60%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:#06ffff;opacity:.8}.cross:before{width:20px;height:1px;top:10px}.cross:after{height:20px;width:1px;left:10px}button,input{margin:8px;padding:8px}img{max-width:520px;width:100%}p{max-width:900px;line-height:1.6}small{color:#bbc}</style>
<main><h2>Harness 六帧挥剑 · 原始结果测试</h2><p>未经修图、去背景或锚点对齐。青色十字为固定参考点；本预览按3×2等分播放，故会直接暴露越格裁切和人物漂移，不是正式动画验收。</p>
<div><button id="toggle">暂停</button><button id="next">下一帧</button><label>帧率 <input id="fps" type="range" min="2" max="16" value="8"><span id="rate">8</span> fps</label><span id="counter"></span></div>
<div class="views"><div class="stage"><div class="sprite" id="sprite"></div><div class="cross"></div></div><div><img src="HA_Swing6_Test_v01.png" alt="六帧原始帧表"><p><small>顺序：上排左到右，再下排左到右。测试背景为灰色，不宣称透明。</small></p></div></div></main>
<script>const sprite=document.getElementById('sprite'),counter=document.getElementById('counter'),fps=document.getElementById('fps'),toggle=document.getElementById('toggle');let frame=0,playing=true,last=0;function show(){sprite.style.backgroundPosition=`${frame%3*50}% ${Math.floor(frame/3)*100}%`;counter.textContent=`第 ${frame+1} / 6 帧`;}toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'暂停':'播放';last=0;};document.getElementById('next').onclick=()=>{playing=false;toggle.textContent='播放';frame=(frame+1)%6;show();};fps.oninput=()=>document.getElementById('rate').textContent=fps.value;function tick(t){if(playing&&t-last>=1000/Number(fps.value)){frame=(frame+1)%6;show();last=t;}requestAnimationFrame(tick);}show();requestAnimationFrame(tick);</script></html>
